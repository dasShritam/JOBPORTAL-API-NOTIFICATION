apiVersion: v1
kind: List
items:
  - apiVersion: v1
    kind: Secret
    metadata:
      name: {{ .Values.secrets.notification.name }}
      namespace: {{ .Values.app.namespace }}
    type: Opaque
    data:
      NOTIFICATION_SVC_PORT: {{ .Values.secrets.notification.NOTIFICATION_SVC_PORT }}
      ENVIRONMENT: {{ .Values.secrets.notification.ENVIRONMENT }}
      APP_CONNECTIONSTRING_MONGO: {{ .Values.secrets.notification.APP_CONNECTIONSTRING_MONGO }}
      BLOB_AC_NAME: {{ .Values.secrets.notification.BLOB_AC_NAME }}
      BLOB_AC_KEY: {{ .Values.secrets.notification.BLOB_AC_KEY }}
      BLOB_CONNECTION_STRING: {{ .Values.secrets.notification.BLOB_CONNECTION_STRING }}
      BLOB_LOGGER_CONTAINER: {{ .Values.secrets.notification.BLOB_LOGGER_CONTAINER }}
      LOG_LEVEL: {{ .Values.secrets.notification.LOG_LEVEL }}
      MAIL_SVC_HOST: {{ .Values.secrets.notification.MAIL_SVC_HOST }}
      MAIL_SVC_PORT: {{ .Values.secrets.notification.MAIL_SVC_PORT }}
      MAIL_SVC_USERNAME: {{ .Values.secrets.notification.MAIL_SVC_USERNAME }}
      MAIL_SVC_PASSWORD: {{ .Values.secrets.notification.MAIL_SVC_PASSWORD }}
      MAIL_SVC_FROM_NAME: {{ .Values.secrets.notification.MAIL_SVC_FROM_NAME }}
      MAIL_SVC_FROM: {{ .Values.secrets.notification.MAIL_SVC_FROM }}