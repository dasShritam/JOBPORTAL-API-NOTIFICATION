# Default values for jobportal-notification-chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: $(NOTIFICATION_IMG_REGISTRY)
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: $(Build.BuildId)

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  name: notification-svc
  type: ClusterIP
  port: $(NOTIFICATION_SVC_PORT)
  targetPort: $(NOTIFICATION_SVC_PORT)
  protocol: TCP

ingress:
  name: jobportal-ingress-nginx
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: $(INGRESS_HOST)
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  limits:
    cpu: 500m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 500Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector:
  agentpool: app

tolerations: []

affinity: {}

app:
  name: notification-depl
  group: api
  namespace: jobportal-app
  releasename: notification-release
  releasenamespace: jobportal-app
  managedby: Helm

secrets:
  notification:
    name: jobportal-notification-secret
    NOTIFICATION_SVC_PORT: $(NOTIFICATION_SVC_PORT)
    ENVIRONMENT: $(ENVIRONMENT)
    APP_CONNECTIONSTRING_MONGO: $(APP_CONNECTIONSTRING_MONGO)
    BLOB_AC_NAME: $(BLOB_AC_NAME)
    BLOB_AC_KEY: $(BLOB_AC_KEY)
    BLOB_CONNECTION_STRING: $(BLOB_CONNECTION_STRING)
    BLOB_LOGGER_CONTAINER: $(BLOB_LOGGER_CONTAINER)
    LOG_LEVEL: $(LOG_LEVEL)
    MAIL_SVC_HOST: $(MAIL_SVC_HOST)
    MAIL_SVC_PORT: $(MAIL_SVC_PORT)
    MAIL_SVC_USERNAME: $(MAIL_SVC_USERNAME)
    MAIL_SVC_PASSWORD: $(MAIL_SVC_PASSWORD)
    MAIL_SVC_FROM_NAME: $(MAIL_SVC_FROM_NAME)
    MAIL_SVC_FROM: $(MAIL_SVC_FROM)
